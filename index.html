    <link rel="alternate icon" href="%BASE_URL%favicon.ico" />

    <!-- Resolve the theme before first paint so dark mode never flashes. -->
    <script>
      (function () {
        var root = document.documentElement;
        if (!root.dataset.theme) {
          // A host page may already have chosen; otherwise stored choice, then OS.
          try {
            var stored = localStorage.getItem("theme");
            var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
            root.dataset.theme = dark ? "dark" : "light";
          } catch (e) {
            root.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
        }
        // Restore the visitor's "Pause animations" choice before anything moves.
        try {
          if (localStorage.getItem("motion") === "paused") root.dataset.motion = "paused";
        } catch (e) {}
        // Match browser chrome to the chosen theme (CSS sets color-scheme per theme).
        var theme = root.dataset.theme === "dark" ? "dark" : "light";
        var scheme = document.querySelector('meta[name="color-scheme"]');
        if (scheme) scheme.setAttribute("content", theme);
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", theme === "dark" ? "#000000" : "#fbfbfd");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
